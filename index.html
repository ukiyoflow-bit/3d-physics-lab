<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Physics Lab</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        canvas {
            display: block;
        }

        /* Glassmorphism Base Class */
        .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Hamburger Button */
        #hamburger-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            z-index: 1000;
        }

        #hamburger-btn div {
            width: 24px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: 0.3s;
        }

        /* Sidebar Menu */
        #sidebar {
            position: absolute;
            top: 0;
            left: -300px; /* Hidden by default */
            width: 260px;
            height: 100vh;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 900;
            padding-top: 80px;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #sidebar.open {
            left: 0;
        }

        .menu-chapter {
            padding: 10px 25px;
            font-size: 12px;
            font-weight: bold;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-item {
            padding: 15px 25px;
            font-size: 16px;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: 0.2s;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-item.active {
            border-left: 4px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
        }

        /* Retractable Controls Panel (Right Side) */
        #controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            padding: 20px;
            z-index: 100;
        }

        #controls-panel.retracted {
            transform: translateX(320px);
        }

        #toggle-controls-btn {
            position: absolute;
            top: 20px;
            right: 320px; /* Attached to the panel */
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            z-index: 101;
            transition: right 0.3s ease;
        }

        #toggle-controls-btn.retracted {
            right: 20px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        /* Live Details Panel (Bottom Left) */
        #details-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 15px 20px;
            z-index: 100;
            min-width: 200px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 14px;
        }
        
        .value-highlight {
            color: #00ff88;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
        }

        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
    </style>
    <!-- Include Three.js for 3D Graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Hamburger Button -->
    <div id="hamburger-btn" class="glass-panel" onclick="toggleSidebar()">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <!-- Sidebar Menu -->
    <div id="sidebar">
        <div class="menu-chapter">Optics</div>
        <div class="menu-item active">Prism Dispersion</div>
        <!-- Future chapters will go here later! -->
    </div>

    <!-- Toggle Button for Right Panel -->
    <div id="toggle-controls-btn" class="glass-panel" onclick="toggleControls()">
        ›
    </div>

    <!-- Right Retractable Controls -->
    <div id="controls-panel" class="glass-panel">
        <h2>Prism Controls</h2>
        
        <div class="control-group">
            <label>Angle of Incidence (i): <span id="angle-val">45</span>°</label>
            <input type="range" id="angle-slider" min="30" max="60" value="45" step="1">
        </div>

        <div class="control-group">
            <label>Refractive Index (n): <span id="refractive-val">1.50</span></label>
            <input type="range" id="refractive-slider" min="1.3" max="1.8" value="1.5" step="0.01">
        </div>
    </div>

    <!-- Bottom Live Details Display -->
    <div id="details-panel" class="glass-panel">
        <div class="detail-row">
            <span>Material:</span>
            <span class="value-highlight" id="material-name">Crown Glass</span>
        </div>
        <div class="detail-row">
            <span>Deviation Angle (δ):</span>
            <span class="value-highlight" id="deviation-val">38.5°</span>
        </div>
    </div>

    <!-- 3D Physics Script -->
    <script>
        // --- UI TOGGLE LOGIC ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function toggleControls() {
            const panel = document.getElementById('controls-panel');
            const btn = document.getElementById('toggle-controls-btn');
            panel.classList.toggle('retracted');
            btn.classList.toggle('retracted');
            btn.innerHTML = panel.classList.contains('retracted') ? '‹' : '›';
        }

        // Close sidebar if user clicks outside of it on the canvas
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const hamburger = document.getElementById('hamburger-btn');
            if (sidebar.classList.contains('open') && !sidebar.contains(event.target) && !hamburger.contains(event.target)) {
                sidebar.classList.remove('open');
            }
        });

        // --- THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Grid & Lights for visibility
        const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(grid);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // --- 3D PRISM CREATION ---
        const prismGeometry = new THREE.CylinderGeometry(3, 3, 4, 3);
        const prismMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x88ccff,
            transmission: 0.9,
            opacity: 1,
            metalness: 0,
            roughness: 0,
            ior: 1.5,
            thickness: 2.0
        });
        
        const prism = new THREE.Mesh(prismGeometry, prismMaterial);
        // Rotate so it sits flat like a triangle
        prism.rotation.x = Math.PI / 2;
        prism.rotation.y = Math.PI / 6; 
        scene.add(prism);

        // --- ADDING A VISUAL LIGHT BEAM (Placeholder logic) ---
        const beamMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        const beamGeometry = new THREE.CylinderGeometry(0.05, 0.05, 10);
        const incomingBeam = new THREE.Mesh(beamGeometry, beamMaterial);
        incomingBeam.rotation.z = Math.PI / 2;
        incomingBeam.position.set(-6, 0, 0);
        scene.add(incomingBeam);

        camera.position.set(0, 8, 12);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- SLIDER INTERACTION LOGIC ---
        const angleSlider = document.getElementById('angle-slider');
        const angleVal = document.getElementById('angle-val');
        const refractiveSlider = document.getElementById('refractive-slider');
        const refractiveVal = document.getElementById('refractive-val');
        const materialName = document.getElementById('material-name');
        const deviationVal = document.getElementById('deviation-val');

        function updatePhysics() {
            const i = parseFloat(angleSlider.value);
            const n = parseFloat(refractiveSlider.value);
            
            // Update UI Numbers
            angleVal.innerText = i;
            refractiveVal.innerText = n.toFixed(2);
            
            // Basic Material Logic
            if(n < 1.4) materialName.innerText = "Water/Ice";
            else if (n < 1.6) materialName.innerText = "Crown Glass";
            else materialName.innerText = "Flint Glass";

            // Dummy calculation for deviation just to show live updating (Formula: δ = i + e - A)
            const approxDeviation = (i * 0.8) + (n * 10) - 30;
            deviationVal.innerText = approxDeviation.toFixed(1) + "°";

            // Visually tilt the incoming beam slightly based on slider
            incomingBeam.rotation.z = (Math.PI / 2) + (i - 45) * 0.01;
        }

        angleSlider.addEventListener('input', updatePhysics);
        refractiveSlider.addEventListener('input', updatePhysics);

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        animate();
    </script>
</body>
</html>
